<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LabControl{% endblock %}</title>
  <style>
    :root { --ink:#17243a; --muted:#65738b; --line:#dfe6ef; --paper:#f4f7fb; --blue:#2357c6; --blue-dark:#173d91; --green:#137454; --amber:#9a5a06; --red:#ad3434; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "Segoe UI",Arial,sans-serif; }
    header { background:#142746; color:white; }
    .topbar { max-width:1180px; margin:auto; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; background:#2b61c8; font-weight:800; }
    .brand h1 { margin:0; font-size:20px; letter-spacing:.2px; }
    .brand p { margin:2px 0 0; color:#c6d2e5; font-size:13px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; }
    nav a { color:#e2eaf7; padding:8px 11px; border-radius:8px; text-decoration:none; font-size:13px; }
    nav a:hover { background:#263d60; }
    main { max-width:1180px; margin:28px auto 56px; padding:0 24px; }
    .intro { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:22px; }
    .intro h2 { margin:0; font-size:25px; }
    .intro p { margin:5px 0 0; color:var(--muted); }
    .network-note { color:#31496d; background:#e7eef9; border:1px solid #d1def2; border-radius:10px; padding:10px 13px; font-size:13px; }
    .flash { padding:12px 15px; margin:0 0 16px; border-radius:9px; background:#e7f5ef; color:#125b42; border:1px solid #bde4d3; }
    .flash.error { background:#fff0ef; color:#922a2a; border-color:#f2c6c2; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px; }
    .stat,.panel { background:white; border:1px solid var(--line); border-radius:13px; box-shadow:0 3px 12px #1d35550a; }
    .stat { padding:17px 19px; }
    .stat span { display:block; color:var(--muted); font-size:13px; }
    .stat strong { display:block; font-size:27px; margin-top:2px; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .panel { padding:19px; margin-bottom:16px; scroll-margin-top:18px; }
    .panel h3 { margin:0; font-size:17px; }
    .panel-head { display:flex; justify-content:space-between; align-items:start; gap:12px; margin-bottom:15px; }
    .panel-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    form.grid-form { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field.full { grid-column:1/-1; }
    label { color:#3f4e64; font-size:12px; font-weight:650; }
    input,select,textarea { width:100%; min-height:39px; padding:9px 10px; border:1px solid #ccd6e3; border-radius:8px; color:var(--ink); background:white; font:inherit; font-size:13px; }
    textarea { min-height:72px; resize:vertical; }
    input:focus,select:focus,textarea:focus { outline:2px solid #b8cdf7; border-color:#7297e4; }
    button,.button { display:inline-flex; justify-content:center; align-items:center; border:0; border-radius:8px; background:var(--blue); color:white; padding:9px 13px; font:inherit; font-size:13px; font-weight:650; cursor:pointer; text-decoration:none; }
    button:hover,.button:hover { background:var(--blue-dark); }
    form.grid-form button { grid-column:1/-1; justify-self:start; margin-top:2px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; color:#68768b; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    td { padding:10px 8px; border-bottom:1px solid #edf1f6; vertical-align:top; }
    tr:last-child td { border-bottom:0; }
    .code { font-weight:750; white-space:nowrap; }
    .subtext { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .pill { display:inline-flex; border-radius:99px; padding:3px 8px; font-size:11px; font-weight:700; background:#edf1f6; color:#40516b; white-space:nowrap; }
    .pill.green { background:#e4f5ed; color:var(--green); }
    .pill.amber { background:#fff2d9; color:var(--amber); }
    .pill.red { background:#fde9e7; color:var(--red); }
    .alert-list { display:grid; gap:8px; }
    .alert-item { display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid #f0dfbd; background:#fffaf0; border-radius:9px; }
    .empty { color:var(--muted); padding:14px 8px; font-size:13px; }
    .small-form { display:inline; }
    .small-form button { padding:5px 8px; font-size:11px; background:#e8f4ee; color:#176342; }
    .small-form button:hover { background:#d3eadf; }
    .hint { color:var(--muted); font-size:11px; margin:10px 0 0; }
    footer { max-width:1180px; padding:0 24px 24px; margin:auto; color:#7b8798; font-size:12px; }
    @media (max-width:760px) { .topbar,.intro { align-items:flex-start; flex-direction:column; } .layout { grid-template-columns:1fr; } nav { margin-left:-8px; } }
    @media (max-width:520px) { .topbar,main,footer { padding-left:15px; padding-right:15px; } .stats { grid-template-columns:1fr; gap:9px; } .stat { padding:13px 16px; } .stat strong { font-size:23px; } .intro h2 { font-size:22px; } form.grid-form { grid-template-columns:1fr; } .field.full,form.grid-form button { grid-column:auto; } }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">LC</div>
        <div><h1>LabControl</h1><p>Equipos y mantenimiento del laboratorio</p></div>
      </div>
      <nav aria-label="Navegación principal">
        <a href="#equipos">Equipos</a><a href="#incidencias">Incidencias</a><a href="#mantenimientos">Mantenimientos</a><a href="#reportes">Reportes</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Prototipo académico · Acceso desde la red local · Los datos se guardan en SQLite en la computadora anfitriona.</footer>
</body>
</html>
